    sort_by: score
scoring:
  llm_evaluator:
    candidate_profile: 'Candidate Profile Summary:

      M.Sc. Data Science (GPA 1.1, Leipzig University) with a background in Industrial
      Engineering and Computer Science. Currently completing a Master''s Thesis at
      Stony Brook University on Foundation Models for electricity grids.

      Key Expertise: 4+ years at Fraunhofer FIT specializing in energy optimization
      and data analysis. Lead-authored research for a €100M project that directly
      influenced German grid fee policy (BNetzA). Proficient in Python, PyTorch, Gurobi,
      and SQL.

      Core Strengths: Bridging the gap between advanced Operations Research (OR) and
      modern Machine Learning (ML). Experienced in delivering production-ready optimization
      tools for EV charging and global logistics.


      Search Criteria:

      1. Role Types: Data Scientist (ML/Specialist), Machine Learning Engineer, Quantitative
      Researcher (Energy/Trading), or Optimization Specialist. High interest in "Founding
      Engineer" or early-stage technical roles.

      2. Domain Focus: Energy Transition, Climate Tech, Smart Grids, and Electricity
      Markets. Specifically looking for roles involving forecasting, optimal power
      flow, or foundation models for infrastructure.

      3. Company Environment: Prioritizing "best-in-class" talent density and research-heavy
      engineering teams. Prefers high-growth startups or specialized AI units over
      generalist corporate roles.

      4. Location: Primarily Munich, Germany (Hybrid/Office).

      5. Seniority/Impact: Seeking roles that offer tangible real-world impact and
      high autonomy. Packages should reflect specialized expertise in ML/Optimization.

      '
    enabled: true
    model: moonshotai/kimi-k2.5
    top_k_to_evaluate: 200
